# Connect to Metro via the Expo Dev Client manual-entry form.
#
# Some Dev Client variants show "New development server" or "Enter URL manually"
# as the button that opens the form; others render the form already expanded.
# Only tap a launcher affordance when the Connect form is not already visible.
#
appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- runFlow:
    when:
      visible: "New development server"
    commands:
      - runFlow:
          when:
            notVisible: "Connect"
          commands:
            - tapOn: "New development server"

- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - runFlow:
          when:
            notVisible: "Connect"
          commands:
            - tapOn: "Enter URL manually"

- runFlow:
    when:
      visible: "(Loading from|Bundling.*|Downloading.*|Loading\\.\\.\\.)"
    commands:
      - extendedWaitUntil:
          visible: "(Error loading app|Could not connect to development server|There was a problem loading the project|This is the developer menu.*|Continue|Go home|Go To Home|Login with mobile app|Create account|What would you like to work on\\?|Hi! How can I help you today\\?|Sessions|Start a session from your computer)"
          timeout: 300000

- runFlow:
    when:
      visible: "Connect"
      notVisible: "(Loading from|Bundling.*|Downloading.*|Loading\\.\\.\\.)"
    commands:
      - tapOn: "(http://.*:[0-9]+|exp://.*)"
      - eraseText
      - setClipboard: ${HAPPIER_E2E_DEV_CLIENT_METRO_URL}
      - pasteText
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - extendedWaitUntil:
          visible: "(Loading from|Bundling.*|Downloading.*|Loading\\.\\.\\.|Error loading app|Could not connect to development server|There was a problem loading the project|This is the developer menu.*|Continue|Go home|Go To Home|Login with mobile app|Create account|What would you like to work on\\?|Hi! How can I help you today\\?|Sessions|Start a session from your computer)"
          timeout: 300000
